<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1122" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('hb-theme');
          var t = s === 'light' || s === 'dark' ? s : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name=theme-color]');
          if (m) m.setAttribute('content', t === 'light' ? '#fff7ec' : '#0a1122');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.png" type="image/svg+xml" />
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
